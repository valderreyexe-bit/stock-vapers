<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Stock Vapers</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">💨 StockVape</h1>
    <button id="copy-btn" class="btn-copy">📋 Copiar Lista</button>
  </header>

  <!-- Dashboard de Métricas -->
  <section class="dashboard">
    <div class="dash-card">
      <span class="dash-label">Stock Total</span>
      <span id="dash-qty" class="dash-value">0 u.</span>
    </div>
    <div class="dash-card">
      <span class="dash-label">Valor Estimado</span>
      <span id="dash-val" class="dash-value">$ 0</span>
    </div>
  </section>

  <div class="search-container">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar modelo o sabor...">
  </div>

  <div id="stock-container" class="stock-list"></div>

  <button id="fab-btn" class="fab">+</button>

  <div id="toast-container" class="toast-container"></div>

  <!-- Modal Ingresar Stock -->
  <div id="add-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📦 Ingresar Stock</h3>
        <button id="close-modal-btn" class="btn-close">✕</button>
      </div>
      
      <div class="form-group">
        <label>Modelo / Marca</label>
        <input type="text" id="model-input" placeholder="Ej: ELFBAR TRIO 40K">
      </div>

      <div class="form-group">
        <label>Precio de Venta ($)</label>
        <input type="number" id="price-input" placeholder="Ej: 25000">
      </div>
      
      <div class="form-group">
        <label>Sabores (Pegá una lista o separá por comas)</label>
        <textarea id="flavor-input" placeholder="Ej: Menta, Uva, Frutilla..." rows="3"></textarea>
      </div>
      
      <div class="form-group row">
        <label>Cantidad base:</label>
        <input type="number" id="qty-input" value="1" min="1">
      </div>
      
      <button id="save-btn" class="btn-save">Agregar al Stock</button>
    </div>
  </div>

  <!-- Modal Selector WhatsApp -->
  <div id="copy-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📋 Copiar para WhatsApp</h3>
        <button id="close-copy-modal-btn" class="btn-close">✕</button>
      </div>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">¿Cómo querés exportar la lista?</p>
      <button id="copy-with-price-btn" class="btn-save" style="margin-bottom: 12px;">💵 Con Precios ($)</button>
      <button id="copy-without-price-btn" class="btn-save" style="background: var(--surface-light); color: var(--text);">📋 Solo Stock y Sabores</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
