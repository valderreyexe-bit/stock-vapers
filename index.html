<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Stock Vapers</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">💨 StockVape</h1>
    <button id="copy-btn" class="btn-copy">📋 Copiar Lista</button>
  </header>

  <div class="search-container">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar modelo o sabor...">
  </div>

  <div id="stock-container" class="stock-list"></div>

  <button id="fab-btn" class="fab">+</button>

  <div id="toast-container" class="toast-container"></div>

  <div id="add-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📦 Ingresar Stock</h3>
        <button id="close-modal-btn" class="btn-close">✕</button>
      </div>
      
      <div class="form-group">
        <label>Modelo / Marca</label>
        <input type="text" id="model-input" placeholder="Ej: Elfbar 5000">
      </div>
      
      <!-- ACÁ ESTÁ EL CAMBIO PARA PEGAR LISTAS -->
      <div class="form-group">
        <label>Sabores (Pegá una lista o separá por comas)</label>
        <textarea id="flavor-input" placeholder="Ej: Menta, Sandia, Uva..." rows="3"></textarea>
      </div>
      
      <div class="form-group row">
        <label>Cantidad (para todos):</label>
        <input type="number" id="qty-input" value="1" min="1">
      </div>
      
      <button id="save-btn" class="btn-save">Agregar Sabores</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
