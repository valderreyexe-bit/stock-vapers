<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Stock Vapers</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121214">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3233/3233967.png">
</head>
<body>
  <div class="container">
    <header>
      <h1>💨 Stock Vapers</h1>
      <button id="copy-btn" class="btn btn-whatsapp">📋 Copiar Lista</button>
    </header>

    <input type="text" id="search-input" class="search-bar" placeholder="🔍 Buscar modelo o sabor...">

    <div id="stock-container"></div>

    <button id="fab-btn" class="fab">➕</button>
  </div>

  <!-- Modal para agregar nueva mercadería -->
  <div id="add-modal" class="modal hidden">
    <div class="modal-content">
      <h3>📦 Ingreso Rápido</h3>
      <div class="form-group">
        <input type="text" id="model-input" placeholder="Modelo (ej: Elfbar 5000)">
        <input type="text" id="flavor-input" placeholder="Sabor (ej: Menta)">
        <div style="display:flex; gap:10px; align-items:center;">
            <label style="color:#e1e1e6;">Cantidad:</label>
            <input type="number" id="qty-input" value="1" min="1" style="width: 80px;">
        </div>
        <div style="display:flex; gap:10px; margin-top: 20px;">
            <button id="cancel-btn" class="btn btn-red" style="flex:1;">Cancelar</button>
            <button id="save-btn" class="btn btn-green" style="flex:1;">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
