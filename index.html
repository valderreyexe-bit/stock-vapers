<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Stock Vapers</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">💨 StockVape</h1>
    <div style="display: flex; gap: 10px;">
      <button id="btn-history" class="btn-icon-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      </button>
      <button id="btn-settings" class="btn-icon-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <button id="btn-open-copy" class="btn-copy">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copiar
      </button>
    </div>
  </header>

  <div class="dashboard">
    <div class="dash-card">
      <span class="dash-label">Stock Total</span>
      <span class="dash-value" id="total-qty">0 u.</span>
    </div>
    <div class="dash-card">
      <span class="dash-label">Valor Venta</span>
      <span class="dash-value accent private-text" id="total-money">$0</span>
    </div>
    <div class="dash-card full" style="flex-direction: row; justify-content: space-between; align-items: center;">
      <div style="display: flex; flex-direction: column;">
        <span class="dash-label" style="color: var(--warning);">Ganancia Neta (Limpia)</span>
        <span class="dash-value private-text" style="color: var(--warning);" id="total-profit">$0</span>
      </div>
      <button id="btn-toggle-eye" class="btn-icon-header" style="background: rgba(255,255,255,0.05); padding: 10px;"></button>
    </div>
  </div>

  <div class="sticky-tools">
    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar modelo o sabor...">
    </div>
    <div class="filter-container">
      <button class="filter-chip active" data-filter="all">Todos</button>
      <button class="filter-chip" data-filter="low">⚠️ Poco Stock (≤ 2)</button>
      <button class="filter-chip" data-filter="out">🚫 Agotados</button>
    </div>
  </div>

  <div id="stock-container" class="stock-list"></div>

  <button id="fab-btn" class="fab">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>

  <div id="toast-container" class="toast-container"></div>

  <!-- MODAL DE CARGA -->
  <div id="add-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📦 Ingresar Stock</h3>
        <button id="close-modal-btn" class="btn-close">✕</button>
      </div>
      <div class="form-group">
        <label>Modelo / Marca</label>
        <input type="text" id="model-input" placeholder="Ej: Elfbar 5000">
      </div>
      
      <div class="form-group row" style="gap: 12px;">
        <div style="flex: 1;">
          <label>Costo c/u ($)</label>
          <input type="number" id="cost-input" placeholder="Ej: 8000" min="0" style="width: 100%;">
        </div>
        <div style="flex: 1;">
          <label>Venta c/u ($)</label>
          <input type="number" id="price-input" placeholder="Ej: 15000" min="0" style="width: 100%;">
        </div>
      </div>
      
      <div class="form-group">
        <label>Sabores (Pegá una lista o separá por comas)</label>
        <textarea id="flavor-input" placeholder="Ej: Menta, Sandia..." rows="3"></textarea>
      </div>
      <div class="form-group row" style="justify-content: flex-start; gap: 16px;">
        <label>Cantidad (para c/u):</label>
        <input type="number" id="qty-input" value="1" min="1" style="width: 80px;">
      </div>
      <button id="save-btn" class="btn-save">Guardar Sabores</button>
    </div>
  </div>

  <!-- MODAL AJUSTES Y BACKUP -->
  <div id="settings-modal" class="modal hidden action-sheet">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ Ajustes y Respaldo</h3>
        <button id="close-settings-btn" class="btn-close">✕</button>
      </div>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Descargá una copia de seguridad para no perder tu inventario ni ventas.</p>
      <button id="export-btn" class="btn-save" style="margin-bottom: 12px; background: var(--accent);">💾 Descargar Backup</button>
      <div style="position: relative;">
        <input type="file" id="import-file" accept=".json" style="position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
        <button class="btn-save btn-secondary">📂 Restaurar Backup</button>
      </div>
    </div>
  </div>

  <!-- MODAL HISTORIAL DE VENTAS -->
  <div id="history-modal" class="modal hidden">
    <div class="modal-content" style="max-height: 85vh; display: flex; flex-direction: column;">
      <div class="modal-header" style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <h3 style="margin: 0;">📜 Historial</h3>
          <button id="btn-clear-history" style="background: rgba(255, 69, 58, 0.15); color: var(--danger); border: 1px solid rgba(255, 69, 58, 0.3); padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase;">Vaciar</button>
        </div>
        <button id="close-history-btn" class="btn-close">✕</button>
      </div>
      
      <div class="history-tabs">
        <button class="history-tab active" id="tab-today">Hoy</button>
        <button class="history-tab" id="tab-all">Todo</button>
      </div>

      <div class="history-summary">
        <div class="history-stat">
          <span class="history-stat-label">Vendidos</span>
          <span class="history-stat-value" id="history-qty">0</span>
        </div>
        <div class="history-stat">
          <span class="history-stat-label">Ingresos</span>
          <span class="history-stat-value text-success private-text" id="history-money">$0</span>
        </div>
        <div class="history-stat">
          <span class="history-stat-label">Ganancia</span>
          <span class="history-stat-value private-text" style="color: var(--warning);" id="history-profit">$0</span>
        </div>
      </div>

      <div id="history-list" class="history-list" style="overflow-y: auto; flex: 1;"></div>
    </div>
  </div>

  <!-- ACTION SHEET: COPIAR (ACÁ ESTÁ EL BOTÓN DE PEDIDO) -->
  <div id="copy-modal" class="modal hidden action-sheet">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📋 Opciones de copia</h3>
        <button id="close-copy-btn" class="btn-close">✕</button>
      </div>
      <button id="copy-simple-btn" class="btn-save btn-secondary" style="margin-bottom: 12px;">Solo Stock (Redes Sociales)</button>
      <button id="copy-price-btn" class="btn-save" style="margin-bottom: 16px;">Stock con Precios de Venta</button>
      
      <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;">
      
      <button id="copy-order-btn" class="btn-save" style="background: var(--warning); color: #000; box-shadow: 0 4px 12px rgba(255,159,10,0.3);">📦 Generar Pedido de Reposición</button>
    </div>
  </div>

  <!-- MODAL DE EDICIÓN -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>✏️ Editar Modelo</h3>
        <button id="close-edit-btn" class="btn-close">✕</button>
      </div>
      <input type="hidden" id="edit-old-name">
      <div class="form-group">
        <label>Nombre del Modelo</label>
        <input type="text" id="edit-model-name">
      </div>
      <div class="form-group row" style="gap: 12px;">
        <div style="flex: 1;">
          <label>Costo c/u ($)</label>
          <input type="number" id="edit-model-cost" style="width: 100%;">
        </div>
        <div style="flex: 1;">
          <label>Venta c/u ($)</label>
          <input type="number" id="edit-model-price" style="width: 100%;">
        </div>
      </div>
      <button id="save-edit-btn" class="btn-save">Actualizar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
